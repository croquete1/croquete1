 <text x="94" y="69" fill="#A8B6CE" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">BUILDING IN PUBLIC</text>
 <g font-family="Arial, Helvetica, sans-serif">
  <text x="56" y="163" font-size="78" font-weight="800" letter-spacing="-3.5" fill="#F5F7FF">ANDRÉ</text>
