<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" width="1280" height="380" role="img" aria-labelledby="title desc">
<title id="title">André Gomes — software developer and open-source contributor</title>
<desc id="desc">Premium developer portfolio banner with elegant gradient lettering and a stylised terminal window.</desc>
<defs>
 <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080E1C"/><stop offset=".60" stop-color="#111831"/><stop offset="1" stop-color="#17142D"/></linearGradient>
 <linearGradient id="accent" x1="0" x2="1" y1="0" y2=".4"><stop stop-color="#62E4CF"/><stop offset=".5" stop-color="#76BDFB"/><stop offset="1" stop-color="#B291FD"/></linearGradient>
 <radialGradient id="aura"><stop stop-color="#7465E8" stop-opacity=".24"/><stop offset="1" stop-color="#7465E8" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#7585B0" stroke-opacity=".10"/></pattern>
 <clipPath id="rounded"><rect width="1280" height="380" rx="22"/></clipPath>
</defs>
<g clip-path="url(#rounded)">
